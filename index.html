<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Viewer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .pdf-container {
      width: 100%;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .top-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }

    .upload-btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .upload-btn:hover {
      opacity: 0.9;
    }

    input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <label class="upload-btn" for="pdfUpload">
      Upload PDF
    </label>
    <input type="file" id="pdfUpload" accept="application/pdf" />
  </div>

  <div class="pdf-container">
    <iframe id="pdfViewer"></iframe>
  </div>

  <script>
    const pdfUpload = document.getElementById('pdfUpload');
    const pdfViewer = document.getElementById('pdfViewer');

    pdfUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];

      if (file && file.type === 'application/pdf') {
        const fileURL = URL.createObjectURL(file);
        pdfViewer.src = fileURL;
      } else {
        alert('Please upload a valid PDF file.');
      }
    });
  </script>

</body>
</html>
