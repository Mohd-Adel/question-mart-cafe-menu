<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question MART & CAFE Menu</title>

  <meta property="og:title" content="Question MART & CAFE" />
  <meta property="og:description" content="Check our full café menu online." />
  <meta property="og:image" content="Logo.PNG" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://mohd-adel.github.io/menu-site/" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Question MART & CAFE" />
  <meta name="twitter:description" content="Check our full café menu online." />
  <meta name="twitter:image" content="logo.png" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
    background:#0d0d0d;
      font-family: Arial, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .loader img {
      width: 120px;
      margin-bottom: 25px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .menu-container{
    width:100%;
    max-width:900px;
    margin:auto;
    padding:20px 10px;
}

.menu-page{
    width:100%;
    display:block;
    margin:0 auto 25px;
    border-radius:16px;
    box-shadow:
        0 10px 30px rgba(0,0,0,.4),
        0 0 1px rgba(255,255,255,.1);
}

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .pdf-container {
      width: 100%;
      height: 100vh;
    }

    embed {
      width: 100%;
      height: 100%;
      border: none;
    }

    .top-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }

    .upload-btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .upload-btn:hover {
      opacity: 0.9;
    }

    input {
      display: none;
    }
  </style>
</head>
<body>

<div class="loader" id="loader">
    <img src="Logo.PNG" alt="Question MART & CAFE">
    <div class="spinner"></div>
</div>

<div class="menu-container">

 <img src="Menu-Page-1.png" alt="Menu Page 1" class="menu-page">
  <img src="Menu-Page-2.png" alt="Menu Page 2" class="menu-page">
  <img src="Menu-Page-3.png" alt="Menu Page 3" class="menu-page">
  <img src="Menu-Page-4.png" alt="Menu Page 4" class="menu-page">
  <img src="Menu-Page-5.png" alt="Menu Page 5" class="menu-page">

</div>

<script>
window.onload = function () {

    setTimeout(function () {

        const loader = document.getElementById('loader');

        loader.style.opacity = '0';

        setTimeout(function () {
            loader.style.display = 'none';
        }, 400);

    }, 3000);

};
</script>

</body>
</html>
