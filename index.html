<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Question Mart & Cafe</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    .loader {
      position: fixed;
      inset: 0;
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    .loader img {
      width: 120px;
      margin-bottom: 25px;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    .pdf-container {
      width: 100%;
      height: 100vh;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .top-bar {
      position: fixed;
      top: 15px;
      right: 15px;
      z-index: 1000;
    }

    .upload-btn {
      background: #ffffff;
      color: #000;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .upload-btn:hover {
      opacity: 0.9;
    }

    input {
      display: none;
    }
  </style>
</head>
<body>

  <div class="loader" id="loader">
    <img src="Logo.png" alt="Logo" />
    <div class="spinner"></div>
  </div>

  <div class="pdf-container">
    <iframe id="pdfViewer"></iframe>
  </div>

  <script>
    const pdfViewer = document.getElementById('pdfViewer');
    const loader = document.getElementById('loader');

    pdfViewer.src = 'Menu.pdf';

    pdfViewer.onload = () => {
      loader.style.opacity = '0';

      setTimeout(() => {
        loader.style.display = 'none';
      }, 400);
    };
  </script>

</body>
</html>
